name: Build and Publish to Harbor

on:
  push:
    tags:
      - "v*"
    branches:
      - develop

env:
  REGISTRY: registry.hyperlakehouse.com
  PROJECT: hyperlake-dev

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — HyperFlow UI
  # ─────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build and push frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          build-args: |
            REACT_APP_API_URL=https://hyperflow.hyperlake.sa
            REACT_APP_KEYCLOAK_BASE_URL=https://hyperflow.hyperlake.sa
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/hyperflow-ui:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/hyperflow-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Each backend service gets its own job → own runner → own JVM.
  # Shared Gradle build cache (type=gha) speeds up repeated dependency
  # resolution across jobs.
  # ─────────────────────────────────────────────────────────────────────────
  build-bootloader:
    name: Push bootloader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else echo "tag=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and push
        run: ./gradlew :oss:airbyte-bootloader:dockerBuildImage -Pdocker.tag=${{ steps.meta.outputs.tag }} -Pdocker.registry=${{ env.REGISTRY }}/${{ env.PROJECT }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

  build-cron:
    name: Push cron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else echo "tag=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and push
        run: ./gradlew :oss:airbyte-cron:dockerBuildImage -Pdocker.tag=${{ steps.meta.outputs.tag }} -Pdocker.registry=${{ env.REGISTRY }}/${{ env.PROJECT }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

  build-server:
    name: Push server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else echo "tag=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and push
        run: ./gradlew :oss:airbyte-server:dockerBuildImage -Pdocker.tag=${{ steps.meta.outputs.tag }} -Pdocker.registry=${{ env.REGISTRY }}/${{ env.PROJECT }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

  build-worker:
    name: Push worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else echo "tag=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and push
        run: ./gradlew :oss:airbyte-workers:dockerBuildImage -Pdocker.tag=${{ steps.meta.outputs.tag }} -Pdocker.registry=${{ env.REGISTRY }}/${{ env.PROJECT }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

  build-workload-launcher:
    name: Push workload-launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else echo "tag=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and push
        run: ./gradlew :oss:airbyte-workload-launcher:dockerBuildImage -Pdocker.tag=${{ steps.meta.outputs.tag }} -Pdocker.registry=${{ env.REGISTRY }}/${{ env.PROJECT }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

  build-container-orchestrator:
    name: Push container-orchestrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else echo "tag=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and push
        run: ./gradlew :oss:airbyte-container-orchestrator:dockerBuildImage -Pdocker.tag=${{ steps.meta.outputs.tag }} -Pdocker.registry=${{ env.REGISTRY }}/${{ env.PROJECT }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
